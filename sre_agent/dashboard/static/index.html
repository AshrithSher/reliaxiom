<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRE Agent — Live Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <!-- Header -->
  <header class="px-6 py-3 border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div id="health-dot" class="w-3 h-3 rounded-full bg-emerald-400"></div>
      <h1 class="text-lg font-semibold tracking-tight">SRE Agent</h1>
      <span class="text-slate-500 text-sm hidden md:inline">autonomous incident response</span>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <a id="link-jira" target="_blank" class="text-slate-400 hover:text-sky-300 hidden">Jira ↗</a>
      <a id="link-conf" target="_blank" class="text-slate-400 hover:text-sky-300 hidden">Confluence ↗</a>
      <span id="conn" class="text-slate-500">connecting…</span>
    </div>
  </header>

  <!-- Control bar: agent lifecycle + demo fault injection -->
  <section class="px-6 py-3 border-b border-slate-800 flex flex-wrap items-center gap-3 bg-slate-900/40">
    <div class="flex items-center gap-2">
      <span id="agent-state" class="badge bg-slate-700 text-slate-300">agent: ?</span>
      <button id="btn-agent" class="btn btn-primary">Start agent</button>
    </div>
    <div class="h-5 w-px bg-slate-700 mx-1"></div>
    <span class="text-xs text-slate-500 uppercase tracking-wide">Inject fault</span>
    <div id="fault-buttons" class="flex flex-wrap gap-2"></div>
    <button id="btn-reset" class="btn btn-ghost ml-auto">↺ Reset lab</button>
    <button id="btn-logs" class="btn btn-ghost">Agent log</button>
  </section>

  <!-- KPI strip -->
  <section id="kpis" class="grid grid-cols-2 md:grid-cols-6 gap-3 px-6 py-4"></section>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 px-6 pb-8">
    <div class="lg:col-span-2 bg-slate-900/60 rounded-xl border border-slate-800 p-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Service topology</h2>
      <div id="topology" class="w-full" style="height: 420px;"></div>
      <div class="flex gap-4 mt-2 text-xs text-slate-400">
        <span><span class="legend-dot bg-emerald-400"></span> healthy</span>
        <span><span class="legend-dot bg-amber-400"></span> affected</span>
        <span><span class="legend-dot bg-rose-500"></span> root cause</span>
      </div>
    </div>
    <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-4 flex flex-col">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Incidents</h2>
      <div id="incidents" class="space-y-2 overflow-y-auto" style="max-height: 600px;">
        <p class="text-slate-500 text-sm">No incidents — system healthy.</p>
      </div>
    </div>
  </main>

  <section class="grid grid-cols-1 md:grid-cols-3 gap-4 px-6 pb-10">
    <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Time to resolve (s)</h2>
      <canvas id="mttrChart" height="160"></canvas>
    </div>
    <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Outcomes</h2>
      <canvas id="outcomeChart" height="160"></canvas>
    </div>
    <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Faults by type</h2>
      <canvas id="faultChart" height="160"></canvas>
    </div>
  </section>

  <!-- Incident detail drawer -->
  <div id="drawer" class="drawer translate-x-full">
    <div class="flex items-center justify-between mb-4">
      <h2 id="drawer-title" class="text-lg font-semibold">Incident</h2>
      <button id="drawer-close" class="text-slate-400 hover:text-slate-100 text-2xl leading-none">&times;</button>
    </div>
    <div id="drawer-body" class="space-y-4 text-sm"></div>
  </div>

  <!-- Agent log drawer -->
  <div id="logdrawer" class="drawer translate-x-full">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold">Agent log</h2>
      <button id="logdrawer-close" class="text-slate-400 hover:text-slate-100 text-2xl leading-none">&times;</button>
    </div>
    <pre id="agent-log" class="text-xs text-slate-300 whitespace-pre-wrap font-mono bg-black/40 rounded p-3" style="max-height: calc(100vh - 100px); overflow-y:auto;"></pre>
  </div>

  <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-40"></div>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-lg text-sm shadow-lg"></div>

  <script src="/static/app.js"></script>
</body>
</html>
